main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: "us-central1"
          - batch_api: "batch.googleapis.com/v1"
          - input_image: ${args.input_image}
          - execution_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
          - image_filename: ${text.split(input_image, "/")[(len(text.split(input_image, "/")) - 1)]}
          - raw_strip_id: ${text.split(image_filename, "_")[3]}
          - strip_id: ${text.replace_all(raw_strip_id, "_", "-")}
          - job_id: ${"vhr-chm-" + strip_id + "-" + string(int(sys.now()))}
          - disk_size_gb: ${default(map.get(args, "disk_size_gb"), 500)}
          - boot_disk_mib: ${int(disk_size_gb * 1024)}
          - machine_type: ${default(map.get(args, "machine_type"), "g2-standard-4")}
          - use_spot: ${default(map.get(args, "use_spot"), false)}
          - spot_map:
              "true": "SPOT"
              "false": "STANDARD"
          - provisioning_model: ${spot_map[string(use_spot)]}
          - hf_token: ${default(map.get(args, "hf_token"), sys.get_env("HF_TOKEN"))}
          - limit_tiles: ${default(map.get(args, "limit_tiles"), 0)}
          - start_tile: ${default(map.get(args, "start_tile"), 0)}
    - runPipeline:
        call: http.post
        args:
          url: ${"https://" + batch_api + "/projects/" + project_id + "/locations/" + location + "/jobs"}
          query:
            job_id: ${job_id}
          auth:
            type: OAuth2
          body:
            allocationPolicy:
              instances:
                - policy:
                    machineType: ${machine_type}
                    provisioningModel: ${provisioning_model}
                    bootDisk:
                      type: "pd-ssd"
                      sizeGb: ${disk_size_gb}
                    accelerators:
                      - type: "nvidia-l4"
                        count: 1
                  installGpuDrivers: true
            taskGroups:
            - taskSpec:
                maxRunDuration: 14400s
                maxRetryCount: 3
                lifecyclePolicies:
                  - action: RETRY_TASK
                    actionCondition:
                      exitCodes: [50001]
                environment:
                  variables:
                    GCS_INPUT_IMAGE: ${input_image}
                    HF_TOKEN: ${hf_token}
                    LIMIT_TILES: ${string(limit_tiles)}
                    START_TILE: ${string(start_tile)}
                runnables:
                  - container:
                      imageUri: ${"gcr.io/" + project_id + "/vhr-chm-gpu:latest"}
                      entrypoint: "/bin/bash"
                      commands: ["/mnt/disks/akveg/scripts/vhr_pipeline/run_chm_job.sh"]
                      volumes:
                        - "/mnt/disks/akveg:/mnt/disks/akveg"
                computeResource:
                  cpuMilli: 8000
                  memoryMib: 32768
                  bootDiskMib: ${boot_disk_mib}
                # --- V4.2: GCS Mount Block ---
                volumes:
                  - gcs:
                      remotePath: "akveg-data"
                    mountPath: "/mnt/disks/akveg"

            logsPolicy:
              destination: CLOUD_LOGGING
        result: jobResponse

    - getJobName:
        assign:
          - job_name: ${jobResponse.body.name}

    - pollJob:
        call: http.get
        args:
          url: ${"https://" + batch_api + "/" + job_name}
          auth:
            type: OAuth2
        result: jobStatus
      
    - checkJobStatus:
        switch:
          - condition: ${jobStatus.body.status.state == "SUCCEEDED"}
            next: finish
          - condition: ${jobStatus.body.status.state == "FAILED"}
            next: failJob
        next: waitJob

    - failJob:
        assign:
          - batch_events: ${default(jobStatus.body.status.statusEvents, [])}
          - error_msg: "No details available"
          - job_short_name: ${text.split(job_name, "/")[5]}
          - log_url: '${"https://console.cloud.google.com/logs/query;query=%22" + job_short_name + "%22"}'
    - checkJobEvents:
        switch:
          - condition: ${len(batch_events) > 0}
            assign:
              - error_msg: ${batch_events[len(batch_events) - 1].description}
    - raiseJob:
          raise: '${"Pipeline Job Failed. Error: " + error_msg + ". See logs: " + log_url}'

    - waitJob:
        call: sys.sleep
        args:
          seconds: 30
        next: pollJob

    - finish:
        return: "Pipeline completed successfully"
