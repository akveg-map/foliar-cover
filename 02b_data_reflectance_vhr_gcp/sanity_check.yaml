# Sanity check for CHM Golden Image
# Verifies gcloud path and Python environment
taskGroups:
  - taskSpec:
      runnables:
        - container:
            imageUri: "gcr.io/akveg-map/vhr-chm-gpu:latest"
            entrypoint: "/bin/bash"
            commands:
              - "-c"
              - |
                echo "--- PATH VERIFICATION ---"
                ls /opt/conda/bin/python || echo "Conda Python not found"
                /opt/conda/bin/python -c "import torch; print(f'Torch: {torch.__version__}')" || echo "Torch failed"
                python3 -c "import torch" || echo "Standard Python3 failed"
                echo "--- SUCCESS ---"
      computeResource:
        cpuMilli: 2000
        memoryMib: 4096
logsPolicy:
  destination: CLOUD_LOGGING
