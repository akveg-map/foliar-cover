main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: "us-central1"
          - batch_api: "batch.googleapis.com/v1"
          - input_dir: ${args.input_dir}
          - output_base: ${args.output_base}
          - dem_path: ${args.dem_path}
          - res_pan: ${default(map.get(args, "res_pan"), 0.5)}
          - res_ms: ${default(map.get(args, "res_ms"), 2.0)}
          - skip_seg: ${default(map.get(args, "skip_seg"), false)}
          - disk_size_gb: ${default(map.get(args, "disk_size_gb"), 200)}
          - boot_disk_mib: ${int(disk_size_gb * 1024)}
          - boot_disk_type: ${default(map.get(args, "boot_disk_type"), "pd-balanced")}
          - cpu_milli: ${default(map.get(args, "cpu_milli"), 8000)}
          - memory_mib: ${default(map.get(args, "memory_mib"), 32768)}
          - machine_type: ${default(map.get(args, "machine_type"), "e2-standard-8")}
          - use_spot: ${default(map.get(args, "use_spot"), false)}
          - spot_map:
              "true": "SPOT"
              "false": "STANDARD"
          - provisioning_model: ${spot_map[string(use_spot)]}
        next: runPipeline

    - runPipeline:
        call: http.post
        args:
          url: ${"https://" + batch_api + "/projects/" + project_id + "/locations/" + location + "/jobs"}
          auth:
            type: OAuth2
          body:
            allocationPolicy:
              instances:
                - policy:
                    machineType: ${machine_type}
                    provisioningModel: ${provisioning_model}
                    bootDisk:
                      type: ${boot_disk_type}
            taskGroups:
              - taskSpec:
                  maxRunDuration: 129600s
                  environment:
                    variables:
                      GCS_INPUT_PATH: ${input_dir}
                      GCS_OUTPUT_PATH: ${output_base}
                      DEM_PATH: ${dem_path}
                      GOOGLE_CLOUD_PROJECT: ${project_id}
                      RES_PAN: ${string(res_pan)}
                      RES_MS: ${string(res_ms)}
                      SKIP_SEG: ${string(skip_seg)}
                  runnables:
                    - container:
                        imageUri: ${"gcr.io/" + project_id + "/vhr-cpu:latest"}
                        entrypoint: "/bin/bash"
                        commands: ["-c", "gcloud storage cp gs://akveg-data/scripts/vhr_pipeline/run_job_all.sh . && dos2unix run_job_all.sh && chmod +x run_job_all.sh && bash run_job_all.sh"]
                  computeResource:
                    cpuMilli: ${cpu_milli}
                    memoryMib: ${memory_mib}
                    bootDiskMib: ${boot_disk_mib}
            logsPolicy:
              destination: CLOUD_LOGGING
        result: jobResponse

    - getJobName:
        assign:
          - job_name: ${jobResponse.body.name}

    - pollJob:
        call: http.get
        args:
          url: ${"https://" + batch_api + "/" + job_name}
          auth:
            type: OAuth2
        result: jobStatus
    
    - checkJobStatus:
        switch:
          - condition: ${jobStatus.body.status.state == "SUCCEEDED"}
            next: finish
          - condition: ${jobStatus.body.status.state == "FAILED"}
            next: failJob
        next: waitJob

    - failJob:
        assign:
          - batch_events: ${default(jobStatus.body.status.statusEvents, [])}
          - error_msg: "No details available"
          - job_short_name: ${text.split(job_name, "/")[5]}
          - log_url: '${"https://console.cloud.google.com/logs/query;query=%22" + job_short_name + "%22"}'
    - checkJobEvents:
        switch:
          - condition: ${len(batch_events) > 0}
            assign:
              - error_msg: ${batch_events[len(batch_events) - 1].description}
    - raiseJob:
        raise: '${"Pipeline Job Failed. Error: " + error_msg + ". See logs: " + log_url}'

    - waitJob:
        call: sys.sleep
        args:
          seconds: 30
        next: pollJob

    - finish:
        return: "Pipeline completed successfully"